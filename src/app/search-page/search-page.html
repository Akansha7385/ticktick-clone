<p-dialog 
  [(visible)]="visible" 
  (onHide)="closeDialog()" 
  [modal]="true" 
  [style]="{ width: '35rem' }" 
  [closable]="true" 
  [showHeader]="false" 
  contentStyleClass="p-0 !bg-white p-0 rounded-xl shadow">

  <div class="p-4">
    <div class="flex items-center border-b-2 border-primary mb-6">
      <i class="pi pi-search text-xl mr-3 text-gray-400"></i>
      <input type="text" pInputText placeholder="Search" class="w-full border-none shadow-none text-black focus:outline-1 focus:outline-gray-400" />
      <i class="pi pi-times text-xl mr-3 text-black ml-2.5 cursor-pointer" (click)="closeDialog()"></i>

    </div>

    <div class="flex flex-col items-center justify-center">
      <img src="https://cdn-icons-png.flaticon.com/512/4076/4076549.png" width="100" class="mb-4" />
      <span class="text-gray-500 text-sm">Search tasks, tags, lists and filters</span>
    </div>
  </div>
</p-dialog>
