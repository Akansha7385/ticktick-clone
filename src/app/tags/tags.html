<p-dialog header="Add Tags" [(visible)]="display" [modal]="true" [closable]="true">
  <p-autoComplete 
    [(ngModel)]="selectedTags"
    [suggestions]="filteredTags"
    (completeMethod)="filterTags($event)"
    (onSelect)="onTagSelect($event)"
    [multiple]="true"
    [forceSelection]="false"
    placeholder="Type in a tag">
  </p-autoComplete>

  <div class="flex justify-end gap-2 mt-3">
    <p-button label="Cancel" class="p-button-text" (click)="cancel()"></p-button>
    <p-button label="OK" (click)="saveTags()"></p-button>
  </div>
</p-dialog>
