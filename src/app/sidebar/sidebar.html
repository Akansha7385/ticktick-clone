<!-- Drawer Button -->
<button (click)="toggleDrawer()" class="p-2 text-gray-600 bg-white rounded-md z-50 top-5 left-11">
  <i class="pi pi-bars"></i>
</button>

<div
  [ngClass]="visible ? 'w-48 block' : 'w-0 hidden'"
  class="fixed top-0 left-10 h-full bg-white shadow-lg transform transition-all duration-300 z-40 overflow-hidden"
>
  <div class="flex flex-col h-full bg-gray-100">
    <!-- Today Section -->
    <div class="pt-4 px-4 text-sm text-gray-800">
      <p-button label="Today" (click)="updateSelectedCategory(1)" styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none w-full mb-2 hover:!bg-gray-200"/>
      <p-button label="Next 7 Days" (click)="updateSelectedCategory(2)"styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none w-full mb-2 hover:!bg-gray-200"/>
      <p-button label="Inbox" (click)="updateSelectedCategory(3)"styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none w-full mb-2 hover:!bg-gray-200"/>
    </div>

    <!-- Lists Section -->
   <!-- Lists Section -->
<div class="pt-6 px-4 text-sm text-gray-800">
  <div class="flex justify-between items-center mb-2">
    <h5 class="text-xs font-semibold text-gray-600 uppercase">Lists</h5>
    <!-- Plus button -->
    <button (click)="addCategory()" class="text-gray-600 hover:text-black">
      <i class="pi pi-plus"></i>
    </button>
  </div>

  <p-button 
    *ngFor="let category of categoryList.slice(3)" 
    label="{{category.name}}" 
    styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none w-full mb-2 hover:!bg-gray-200"
    (click)="updateSelectedCategory(category.id)" />
</div>

  </div>
</div>
