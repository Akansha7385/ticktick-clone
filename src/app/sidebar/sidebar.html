<p-drawer #drawerRef [(visible)]="visible" position="left" [modal]="true">
  <ng-template #headless>
    <div class="flex flex-col h-full" style="background-color: #f4f4f4">
      <!-- MAIN SECTIONS -->
      <div class="pt-4 px-4 text-sm text-[#333]">
        <h5 class="text-xs font-semibold text-gray-600 uppercase mb-2">
          Today
        </h5>

        <a
          pRipple
          class="flex justify-between items-center p-2 rounded-md hover:bg-[#e0e0e0] cursor-pointer"
        >
          <span class="flex items-center gap-2">
            <i class="pi pi-calendar text-[#333]"></i>
            <span>Today</span>
          </span>
          <span>1</span>
        </a>

        <a
          pRipple
          class="flex justify-between items-center p-2 rounded-md hover:bg-[#e0e0e0] cursor-pointer"
        >
          <span class="flex items-center gap-2">
            <i class="pi pi-calendar-times text-[#333]"></i>
            <span>Next 7 Days</span>
          </span>
          <span>1</span>
        </a>

        <a
          pRipple
          class="flex justify-between items-center p-2 rounded-md hover:bg-[#e0e0e0] cursor-pointer"
        >
          <span class="flex items-center gap-2">
            <i class="pi pi-inbox text-[#333]"></i>
            <span>Inbox</span>
          </span>
          <span>1</span>
        </a>
      </div>

      <!-- LISTS SECTION -->
      <div class="pt-6 px-4 text-sm text-[#333]">
        <h5 class="text-xs font-semibold text-gray-600 uppercase mb-2">
          Lists
        </h5>

        <a
          pRipple
          class="flex justify-between items-center p-2 rounded-md hover:bg-[#e0e0e0] cursor-pointer"
        >
          <span class="flex items-center gap-2">
            <span class="text-xl">👋</span>
            <span>Welcome</span>
          </span>
          <span>1</span>
        </a>

        <a
          pRipple
          class="flex items-center gap-2 p-2 rounded-md hover:bg-[#e0e0e0] cursor-pointer"
        >
          <i class="pi pi-briefcase text-[#795548]"></i>
          <span>Work</span>
        </a>

        <a
          pRipple
          class="flex items-center gap-2 p-2 rounded-md hover:bg-[#e0e0e0] cursor-pointer"
        >
          <i class="pi pi-check-circle text-[#4caf50]"></i>
          <span>Completed</span>
        </a>

        <a
          pRipple
          class="flex items-center gap-2 p-2 rounded-md hover:bg-[#e0e0e0] cursor-pointer"
        >
          <i class="pi pi-trash text-[#f44336]"></i>
          <span>Trash</span>
        </a>
      </div>
    </div>
  </ng-template>
</p-drawer>

<!-- Toggle Button -->
<p-button (click)="visible = true" icon="pi pi-bars" class="m-2" />
