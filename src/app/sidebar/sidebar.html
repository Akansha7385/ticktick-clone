<p-toast></p-toast>
<p-confirmDialog  header="Are you sure you want to delete this category?"
  icon="pi pi-exclamation-triangle"
    [style]="{ width: '18rem', height: '13rem', maxWidth: '90%' }"
     styleClass="custom-confirm-dialog"
  acceptButtonStyleClass="!bg-blue-600 !border-0 !text-white rounded-lg"
  rejectButtonStyleClass="!bg-red-600 p-button-text !text-white-600 rounded-lg"></p-confirmDialog>


<button
  (click)="toggleDrawer()"
  class="p-2 text-gray-600 bg-white rounded-md z-50 top-5 left-11"
>
  <i class="pi pi-bars"></i>
</button>

<div
  [ngClass]="visible ? 'w-48 block' : 'w-0 hidden'"
  class="fixed top-0 left-10 h-full bg-white shadow-lg transform transition-all duration-300 z-40 overflow-hidden"
>
  <div class="flex flex-col h-full bg-gray-100">
    <!-- Today Section -->
    <div class="pt-4 px-4 text-sm text-gray-800">
     <p-button
  (click)="updateSelectedCategory(1)"
  styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none w-full mb-2 hover:!bg-gray-200 flex items-center !justify-start !text-left"
>
  <i class="pi pi-calendar mr-2"></i> Today
</p-button>

<p-button
  (click)="updateSelectedCategory(2)"
  styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none w-full mb-2 hover:!bg-gray-200 flex items-center !justify-start !text-left"
>
  <i class="pi pi-clock mr-2"></i> Next 7 Days
</p-button>

<p-button
  (click)="updateSelectedCategory(3)"
  styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none w-full mb-2 hover:!bg-gray-200 flex items-center !justify-start !text-left"
>
  <i class="pi pi-inbox mr-2"></i> Inbox
</p-button>

<p-button
  (click)="updateSelectedCategory(4)"
  styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none w-full mb-2 hover:!bg-gray-200 flex items-center !justify-start !text-left"
>
  <i class="pi pi-check-circle mr-2"></i> Completed
</p-button>

    </div>

    <!-- Lists Section -->
    <div class="pt-6 px-4 text-sm text-gray-800">
      <div class="flex justify-between items-center mb-2">
        <h5 class="text-xs font-semibold text-gray-600 uppercase">Lists</h5>
        <!-- Plus button -->
        <button (click)="addCategory()" class="text-gray-600 hover:text-black">
          <i class="pi pi-plus"></i>
        </button>
      </div>
<ng-container *ngFor="let category of categoryList.slice(3)">
      <div class="flex items-center w-full mb-2"
        *ngIf="category.id !== 4"
      >
        <!-- Left side button -->
       <p-button
  styleClass="!bg-gray-100 !text-gray-800 !border-0 !shadow-none !font-normal text-left hover:!bg-gray-200 w-30 !justify-start !text-left"
  (click)="updateSelectedCategory(category.id)"
>
  <i class="pi pi-folder mr-2"></i> {{ category.name }}
</p-button>

        <button
  class="text-gray-500 hover:text-red-600 ml-auto flex-shrink-0"
  (click)="handleDeleteCategory(category.id)"
>
  <i class="pi pi-times"></i>
</button>

      </div>
      </ng-container>
    </div>
  </div>
</div>

<p-dialog 
  header="Add New Category" 
  [(visible)]="showCategoryDialog" 
  [modal]="true" 
  [closable]="true" 
  [dismissableMask]="true"
  [style]="{ width: '25rem' }"
  contentStyleClass="custom-dialog-content"
  styleClass="custom-dialog"
>
  <div class="p-fluid space-y-4">
    <!-- Input Field -->
    <div class="p-field">
      <input 
        id="category" 
        type="text" 
        pInputText 
        [(ngModel)]="newCategoryName"
        class="w-full !bg-white !text-black rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
        placeholder="Enter category name"
      />
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3">
      <p-button 
        label="Cancel" 
        (click)="showCategoryDialog=false" 
        styleClass="p-button-text !text-gray-600 hover:!bg-gray-100 rounded-lg"
      ></p-button>

      <p-button 
        label="Save" 
        (click)="saveCategory()" 
        styleClass="!bg-blue-600 !border-0 !text-white hover:!bg-blue-700 rounded-lg shadow-md"
      ></p-button>
    </div>
  </div>
</p-dialog>
