<div 
  class="h-screen w-[3vw] sm:w-5 md:w-5 lg:w-10 
         !bg-gray-100 flex flex-col items-center py-4 space-y-6 shadow-md
         transition-all duration-300">

  <!-- Top Buttons -->
  <div class="flex flex-col space-y-2">
    <button 
      pButton 
      icon="pi pi-check"
      class="p-button-rounded p-button-text"
      [ngClass]="{
        '!text-blue-500': selectedIcon === 'pi-check',
        '!text-gray-500': selectedIcon !== 'pi-check'
      }"
      (click)="selectedIcon = 'pi-check'">
    </button>

    <button 
      pButton 
      icon="pi pi-calendar"
      class="p-button-rounded p-button-text"
      [ngClass]="{
        '!text-blue-500': selectedIcon === 'pi-calendar',
        '!text-gray-500': selectedIcon !== 'pi-calendar'
      }"
      (click)="selectedIcon = 'pi-calendar'">
    </button>

    <button 
      pButton 
      icon="pi pi-search"
      class="p-button-rounded p-button-text"
      [ngClass]="{
        '!text-blue-500': selectedIcon === 'pi-search',
        '!text-gray-500': selectedIcon !== 'pi-search'
      }"
      (click)="selectedIcon = 'pi-search'; openSearchDialog()">
    </button>
    <app-search-page
     [(visible)]="searchVisible">
    </app-search-page>
  </div>

  <!-- Bottom Buttons -->
  <div class="mt-auto flex flex-col space-y-2 mb-4">
    <button 
      pButton 
      icon="pi pi-refresh"
      class="p-button-rounded p-button-text"
      [ngClass]="{
        '!text-blue-500': selectedIcon === 'pi-refresh',
        '!text-gray-500': selectedIcon !== 'pi-refresh'
      }"
      (click)="selectAndReload()">
    </button>

    <button 
      pButton 
      icon="pi pi-bell"
      class="p-button-rounded p-button-text"
      [ngClass]="{
        '!text-blue-500': selectedIcon === 'pi-bell',
        '!text-gray-500': selectedIcon !== 'pi-bell'
      }"
      (click)="selectedIcon = 'pi-bell'; openNotificationDialog()">
    </button>
    <app-notification-page [(visible)]="notificationVisible"></app-notification-page>

    <button 
      pButton 
      icon="pi pi-question-circle"
      class="p-button-rounded p-button-text"
      [ngClass]="{
        '!text-blue-500': selectedIcon === 'pi-question-circle',
        '!text-gray-500': selectedIcon !== 'pi-question-circle'
      }"
      (click)="selectedIcon = 'pi-question-circle'; openMoreDialog()">
    </button>

    <app-more 
      [visible]="moreVisible"
      (visibleChange)="moreVisible = $event"
      (shortcutClick)="openShortcutDialog()"
      (homeClick)="openHomePage()">
    </app-more>

    <app-shortcut [(visible)]="shortcutVisible"></app-shortcut>
    <app-home *ngIf="homeVisible"></app-home>
  </div>
</div>
