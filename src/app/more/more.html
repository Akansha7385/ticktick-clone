<div 
  *ngIf="visible" 
  class="fixed bottom-0 left-0 mb-4 ml-4 w-50 bg-white shadow-lg rounded-lg p-2 transition-transform duration-300"
  [ngClass]="{ 'translate-y-full': !visible, 'translate-y-0': visible }"
>
  <p-tieredMenu 
    [model]="items" 
    class="w-full !bg-white !text-black border-0 shadow-none"
    styleClass="custom-tieredmenu">
  </p-tieredMenu>
</div>
<app-shortcut [(visible)]="shortcutVisible"></app-shortcut>
