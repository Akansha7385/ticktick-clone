<p-dialog 
  [(visible)]="visible" 
  (onHide)="closeDialog()" 
  [modal]="false" 
  [dismissableMask]="true"
  [style]="{ width: '24rem', position: 'fixed', left: '4rem', bottom: '1.5rem' }"
  [closable]="false" 
  [showHeader]="false"
  [baseZIndex]="1000"
  contentStyleClass="!bg-white p-0 rounded-2xl shadow-lg border border-gray-200"
  [draggable]="false"
  [resizable]="false">

  <!-- Tabs -->
  <div class="flex border-b border-gray-200 text-sm font-medium">
    <button 
      class="w-1/2 py-2 text-center"
      [ngClass]="{ 'text-black bg-gray-100': activeTab === 'notifications', 'text-gray-500': activeTab !== 'notifications' }"
      (click)="activeTab = 'notifications'">
      Notifications
    </button>
    <button 
      class="w-1/2 py-2 text-center"
      [ngClass]="{ 'text-black bg-gray-100': activeTab === 'activities', 'text-gray-500': activeTab !== 'activities' }"
      (click)="activeTab = 'activities'">
      Activities
    </button>
  </div>

  <!-- Content -->
  <div class="p-6 flex flex-col items-center justify-center">

    <!-- Notifications Tab Content -->
    <ng-container *ngIf="activeTab === 'notifications'">
      <img src="https://cdn-icons-png.flaticon.com/512/4076/4076549.png" width="80" class="mb-4" />
      <p class="text-gray-800 text-base font-medium mb-1">No notifications</p>
      <p class="text-gray-400 text-sm text-center">
        Shared list messages will appear here
      </p>
    </ng-container>

    <!-- Activities Tab Content -->
    <ng-container *ngIf="activeTab === 'activities'">
      <img src="https://cdn-icons-png.flaticon.com/512/4076/4076549.png" width="80" class="mb-4" />
      <p class="text-gray-800 text-base font-medium mb-1">No task updates</p>
      <p class="text-gray-400 text-sm text-center">
        Task update notifications will appear here
      </p>
    </ng-container>

  </div>
</p-dialog>
