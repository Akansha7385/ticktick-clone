<p-dialog 
  header="Shortcuts" 
  [(visible)]="visible" 
  [modal]="true" 
  position="right" 
  [dismissableMask]="true"
  [style]="{ width: '350px' }"
  [draggable]="false"
  contentStyleClass="!bg-white !text-black"
  headerStyleClass="!bg-white ">

  
  <div class="space-y-3 ">
    <h2 class="text-lg font-semibold">General</h2>
    <div *ngFor="let shortcut of generalShortcuts" 
         class="flex justify-between items-center border-b border-gray-200 pb-2">
      <span>{{ shortcut.name }}</span>
      <span class="bg-gray-100 px-2 py-0.5 rounded text-sm font-mono text-gray-700">{{ shortcut.key }}</span>
    </div>
  </div>
   <div class="space-y-3 mt-6">
    <h2 class="text-lg font-semibold">Task</h2>
    <div *ngFor="let shortcut of taskShortcuts" 
         class="flex justify-between items-center border-b border-gray-200 pb-2">
      <span>{{ shortcut.name }}</span>
      <span class="bg-gray-100 px-2 py-0.5 rounded text-sm font-mono text-gray-700">{{ shortcut.key }}</span>
    </div>
  </div>
  <div class="space-y-3 mt-6">
    <h2 class="text-lg font-semibold">Quick Add</h2>
    <div *ngFor="let shortcut of quickShortcuts" 
         class="flex justify-between items-center border-b border-gray-200 pb-2">
      <span>{{ shortcut.name }}</span>
      <span class="bg-gray-100 px-2 py-0.5 rounded text-sm font-mono text-gray-700">{{ shortcut.key }}</span>
    </div>
  </div>
  <div class="space-y-3 mt-6">
    <h2 class="text-lg font-semibold">Edit Tasks</h2>
    <div *ngFor="let shortcut of editShortcuts" 
         class="flex justify-between items-center border-b border-gray-200 pb-2">
      <span>{{ shortcut.name }}</span>
      <span class="bg-gray-100 px-2 py-0.5 rounded text-sm font-mono text-gray-700">{{ shortcut.key }}</span>
    </div>
  </div>
  <div class="space-y-3 mt-6">
    <h2 class="text-lg font-semibold">Navigation</h2>
    <div *ngFor="let shortcut of navigationShortcuts" 
         class="flex justify-between items-center border-b border-gray-200 pb-2">
      <span>{{ shortcut.name }}</span>
      <span class="bg-gray-100 px-2 py-0.5 rounded text-sm font-mono text-gray-700">{{ shortcut.key }}</span>
    </div>
  </div>
  <div class="space-y-3 mt-6">
    <h2 class="text-lg font-semibold">Calendar</h2>
    <div *ngFor="let shortcut of calendarShortcuts" 
         class="flex justify-between items-center border-b border-gray-200 pb-2">
      <span>{{ shortcut.name }}</span>
      <span class="bg-gray-100 px-2 py-0.5 rounded text-sm font-mono text-gray-700">{{ shortcut.key }}</span>
    </div>
  </div>

  <button class="mt-3 border border-gray-300 rounded px-3 py-1 text-sm hover:bg-gray-100">
      Reset Default
    </button>
</p-dialog>
